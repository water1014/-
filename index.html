<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#D4C5B0" />
<title>鞠式养成 · 工作台</title>
<style>
  :root{
    --bg:#F2EFEC;
    --primary:#D4C5B0; --accent:#C4B5A0;
    --ink:#2C2C2C; --text:#3A3A3A; --gray:#AAAAAA;
    --line:rgba(200,195,190,0.25);
    --glass-bg:rgba(255,255,255,0.38);
    --glass-border:rgba(200,195,190,0.15);
    --glass-solid:rgba(255,255,255,0.55);
    --glass-flat:rgba(255,255,255,0.70);
    --blur:16px; --radius:20px;
    --shadow:0 4px 20px rgba(0,0,0,0.05);
    --halo1:rgba(212,197,176,0.08); --halo2:rgba(196,181,160,0.06);
    --font-zh:"PingFang SC","Source Han Sans SC","Noto Sans SC Light",-apple-system,"Microsoft YaHei",sans-serif;
    --font-en:"Didot","Cormorant Garamond",Georgia,"Times New Roman",serif;
    --base-size:15px; --title-scale:1.2;
  }
  [data-theme="warm"]{
    --bg:#FBF6F0; --primary:#E8C4C4; --accent:#D4A8B0;
    --glass-bg:rgba(255,255,255,0.55); --glass-border:rgba(232,196,196,0.20);
    --glass-solid:rgba(255,255,255,0.68); --glass-flat:rgba(255,255,255,0.78);
    --halo1:rgba(232,196,196,0.10); --halo2:rgba(212,180,190,0.08);
    --shadow:0 4px 20px rgba(180,150,160,0.08);
  }
  [data-theme="minimal"]{
    --bg:#FFFFFF; --primary:#2C2C2C; --accent:#888888; --ink:#2A2A2A; --text:#2A2A2A; --gray:#BBBBBB;
    --glass-bg:rgba(255,255,255,0.70); --glass-border:rgba(180,180,180,0.25); --glass-solid:rgba(255,255,255,0.85);
    --glass-flat:rgba(255,255,255,0.92); --blur:0px; --halo1:transparent; --halo2:transparent;
    --shadow:0 1px 6px rgba(0,0,0,0.04);
  }
  [data-theme="dark"]{
    --bg:#1F1F1F; --primary:#D4C5B0; --accent:#C4B5A0; --ink:#F2EFEC; --text:#E8E4DE; --gray:#9a9a9a;
    --line:rgba(255,255,255,0.12); --glass-bg:rgba(60,60,60,0.40); --glass-border:rgba(255,255,255,0.10);
    --glass-solid:rgba(60,60,60,0.55); --glass-flat:rgba(40,40,40,0.70);
    --halo1:rgba(212,197,176,0.10); --halo2:rgba(196,181,160,0.08); --shadow:0 4px 20px rgba(0,0,0,0.30);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-zh); background:var(--bg); color:var(--text);
    max-width:480px; margin:0 auto; min-height:100vh; font-size:var(--fs-size); line-height:1.65;
    -webkit-font-smoothing:antialiased; transition:background .4s ease,color .4s ease;
  }
  .en,.boot-quote .en,.home-quote .en,.feed-cat{font-family:var(--font-en);}
  .app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;z-index:1;background:transparent;}
  #bg-layer{position:fixed;inset:0;z-index:-1;background-size:cover;background-position:center;background-attachment:fixed;display:none;}

  .halos{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .halo{position:absolute;width:62vw;height:62vw;border-radius:50%;filter:blur(100px);opacity:1;animation:floaty 15s ease-in-out infinite;}
  .halo.h1{top:-18%;left:-12%;background:var(--halo1);}
  .halo.h2{bottom:-18%;right:-12%;background:var(--halo2);animation-delay:-7.5s;}
  @keyframes floaty{0%,100%{transform:translate(0,0)}50%{transform:translate(20px,20px)}}

  .topbar{
    position:sticky;top:0;z-index:30;padding:14px 16px 12px;display:flex;align-items:center;gap:10px;color:var(--ink);
    background:var(--glass-bg); -webkit-backdrop-filter:blur(var(--blur)) saturate(1.25); backdrop-filter:blur(var(--blur)) saturate(1.25);
    border-bottom:1px solid var(--glass-border); box-shadow:var(--shadow);
  }
  .topbar .menu-btn{font-size:22px;background:none;border:none;cursor:pointer;line-height:1;}
  .topbar .title{font-weight:600;font-size:18px;letter-spacing:.5px;flex:1;}
  .topbar .title small{display:block;font-weight:400;font-size:11px;color:var(--gray);font-family:var(--font-en);}
  .topbar .clock{font-variant-numeric:tabular-nums;font-size:13px;color:var(--text);text-align:right;font-family:var(--font-en);}
  .topbar .clock b{display:block;font-size:16px;font-weight:700;}

  .drawer-mask{position:fixed;inset:0;background:rgba(44,44,44,.40);z-index:60;display:none;}
  .drawer-mask.show{display:block;}
  .drawer{
    position:fixed;top:0;left:0;bottom:0;width:80%;max-width:340px;z-index:70;
    background:var(--glass-bg); -webkit-backdrop-filter:blur(calc(var(--blur) + 6px)) saturate(1.3); backdrop-filter:blur(calc(var(--blur) + 6px)) saturate(1.3);
    border-right:1px solid var(--glass-border); box-shadow:var(--shadow);display:flex;flex-direction:column;
    transform:translateX(-105%);transition:transform .30s ease;
  }
  .drawer.show{transform:translateX(0);}
  .drawer-head{padding:26px 18px 18px;color:var(--ink);border-bottom:1px solid var(--glass-border);}
  .drawer-head h2{margin:0;font-size:20px;font-weight:700;letter-spacing:1px;}
  .drawer-head p{margin:6px 0 0;font-size:12px;color:var(--gray);font-family:var(--font-en);}
  .drawer-list{flex:1;overflow:auto;padding:10px 0;}
  .nav-item{display:flex;align-items:center;gap:12px;padding:14px 18px;cursor:pointer;border:none;background:none;width:100%;text-align:left;font-size:15px;color:var(--text);border-left:4px solid transparent;transition:background .2s;}
  .nav-item:active{background:var(--glass-solid);}
  .nav-item.active{border-left-color:var(--accent);background:var(--glass-solid);font-weight:600;}
  .nav-item .ic{font-size:18px;width:24px;text-align:center;}
  .drawer-foot{padding:12px 16px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--glass-border);}
  .drawer-foot button{width:100%;padding:12px;background:var(--glass-solid);border:1px solid var(--glass-border);border-radius:14px;color:var(--text);font-size:13px;cursor:pointer;}

  .view{padding:14px 14px 40px;display:none;position:relative;z-index:1;}
  .view.active{display:block;animation:pageIn .30s ease;}
  @keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .boot-mask{position:fixed;inset:0;background:rgba(44,44,44,.50);z-index:90;display:flex;align-items:center;justify-content:center;padding:24px;}
  .boot-card{background:var(--glass-bg);-webkit-backdrop-filter:blur(calc(var(--blur) + 8px)) saturate(1.3);backdrop-filter:blur(calc(var(--blur) + 8px)) saturate(1.3);border:1px solid var(--glass-border);border-radius:24px;max-width:340px;width:100%;padding:24px 20px;text-align:center;box-shadow:var(--shadow);overflow:hidden;animation:fadeIn .6s ease;}
  @keyframes fadeIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  .boot-card .bg{width:100%;height:120px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--accent));background-size:cover;background-position:center;margin-bottom:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;}
  .boot-card h1{font-size:17px;margin:6px 0 14px;color:var(--ink);font-weight:600;}
  .boot-quote{background:var(--glass-solid);border:1px solid var(--glass-border);border-radius:14px;padding:14px;margin-bottom:14px;}
  .boot-quote .zh{font-size:14px;line-height:1.7;}
  .boot-quote .en{font-size:11px;color:var(--gray);margin-top:6px;font-style:italic;}
  .boot-card button{background:linear-gradient(135deg,var(--primary),var(--accent));border:none;color:#fff;padding:12px 22px;border-radius:24px;font-size:15px;font-weight:600;cursor:pointer;width:100%;}
  .switch-q{background:none;border:none;color:var(--accent);font-size:12px;margin-top:8px;cursor:pointer;text-decoration:underline;}

  .card{background:var(--glass-bg);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.2);backdrop-filter:blur(var(--blur)) saturate(1.2);border:1px solid var(--glass-border);border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:var(--shadow);animation:rise .4s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card h3{margin:0 0 10px;font-size:calc(var(--fs-size) * var(--title-scale));display:flex;align-items:center;gap:6px;color:var(--ink);}
  .card h3 .tag{margin-left:auto;font-size:11px;color:var(--gray);font-weight:400;}
  .quote-bar{font-size:12px;color:var(--text);background:var(--glass-solid);border-left:3px solid var(--accent);padding:8px 10px;border-radius:8px;margin-bottom:12px;font-style:italic;}

  .banner{position:relative;width:100%;height:120px;border-radius:var(--radius);background:linear-gradient(135deg,var(--primary),var(--accent));background-size:cover;background-position:center;margin-bottom:12px;cursor:pointer;display:flex;align-items:flex-end;justify-content:flex-start;color:#fff;font-size:11px;padding:8px;text-shadow:0 1px 3px rgba(0,0,0,.35);overflow:hidden;border:1px solid var(--glass-border);}
  .banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(212,197,176,.22),rgba(196,181,160,.34));z-index:1;}
  .banner .bcap{position:relative;z-index:2;}

  .home-hero{position:relative;height:150px;border-radius:var(--radius);background:linear-gradient(135deg,var(--primary),var(--accent));background-size:cover;background-position:center;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;color:#fff;margin-bottom:14px;cursor:pointer;box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--glass-border);animation:rise .4s ease both;}
  .home-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(212,197,176,.18),rgba(196,181,160,.30));z-index:1;}
  .home-hero>*{position:relative;z-index:2;}
  .home-hero .date{font-size:13px;opacity:.96;}
  .home-hero .dnum{font-size:26px;font-weight:800;letter-spacing:1px;}
  .home-hero .sub{font-size:11px;opacity:.92;}
  .home-hero .hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;transform-origin:center;transition:transform .05s;}
  .cover-preview{position:relative;width:100%;height:200px;border-radius:14px;overflow:hidden;background:#222;touch-action:none;margin-bottom:6px;}
  .cover-preview img{position:absolute;left:0;top:0;width:100%;height:100%;will-change:transform;user-select:none;-webkit-user-drag:none;}
  .cover-modes{display:flex;gap:8px;margin:10px 0;}
  .cover-modes button{flex:1;padding:9px;border:1px solid var(--glass-border);border-radius:10px;background:var(--glass-flat);font-size:13px;cursor:pointer;color:var(--text);}
  .cover-modes button.active{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border-color:transparent;}
  .cover-zoom{width:100%;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
  .grid .cell{background:var(--glass-bg);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.2);backdrop-filter:blur(var(--blur)) saturate(1.2);border:1px solid var(--glass-border);border-radius:var(--radius);padding:16px 6px;text-align:center;box-shadow:var(--shadow);cursor:pointer;animation:rise .4s ease both;}
  .grid .cell:active{transform:scale(.97);transition:transform .15s;}
  .grid .cell .ic{font-size:24px;display:block;}
  .grid .cell .lb{font-size:11px;margin-top:6px;color:var(--text);display:block;}
  .home-quote{background:var(--glass-bg);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.2);backdrop-filter:blur(var(--blur)) saturate(1.2);border:1px solid var(--glass-border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px;text-align:center;animation:rise .4s ease both;}
  .home-quote .zh{font-size:15px;font-weight:600;line-height:1.7;color:var(--ink);}
  .home-quote .en{font-size:11px;color:var(--gray);font-style:italic;margin-top:8px;}
  .home-quote button{margin-top:10px;background:none;border:1px solid var(--accent);border-radius:18px;padding:6px 14px;color:var(--text);font-size:12px;cursor:pointer;}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .stats .st{background:var(--glass-solid);-webkit-backdrop-filter:blur(calc(var(--blur) - 4px));backdrop-filter:blur(calc(var(--blur) - 4px));border:1px solid var(--glass-border);border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow);animation:rise .4s ease both;}
  .stats .st b{font-size:20px;color:var(--primary);display:block;font-family:var(--font-en);}
  .stats .st span{font-size:11px;color:var(--gray);}

  .item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);}
  .item:last-child{border-bottom:none;}
  .item .cb{flex:0 0 auto;width:20px;height:20px;border-radius:7px;border:2px solid var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;background:transparent;transition:transform .2s,background .2s;}
  .item.done .cb{background:var(--accent);}
  .item .cb:active{transform:scale(.82);}
  .item.done .cb{animation:pop .2s ease;}
  @keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  .item .body{flex:1;font-size:14px;color:var(--text);}
  .item.done .body{color:var(--gray);text-decoration:line-through;}
  .item .meta{font-size:11px;color:var(--gray);}
  .item .ops{flex:0 0 auto;display:flex;gap:6px;}
  .item .ops button{background:none;border:none;color:var(--gray);font-size:15px;cursor:pointer;padding:2px 4px;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{border:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:middle;}
  th{background:var(--glass-solid);color:var(--text);font-weight:600;font-size:12px;}
  td .row-ops{display:flex;gap:4px;}
  td .row-ops button{background:none;border:none;cursor:pointer;font-size:14px;color:var(--gray);}

  .countdown-row{display:flex;align-items:center;justify-content:space-between;padding:10px 4px;border-bottom:1px solid var(--line);}
  .countdown-row:last-child{border-bottom:none;}
  .countdown-row .nm{font-size:14px;color:var(--text);}
  .countdown-row .dd{font-weight:700;color:var(--primary);font-size:15px;font-family:var(--font-en);}
  .countdown-row .dd small{color:var(--gray);font-weight:400;font-size:11px;}
  .countdown-row .ops button{background:none;border:none;color:var(--gray);font-size:15px;cursor:pointer;}

  .cards-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;}
  .skill-card{flex:0 0 150px;background:var(--glass-bg);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));border:1px solid var(--glass-border);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow);animation:rise .4s ease both;}
  .skill-card .nm{font-weight:700;font-size:14px;color:var(--ink);}
  .skill-card .bar{height:8px;background:var(--glass-solid);border-radius:6px;margin:8px 0;overflow:hidden;}
  .skill-card .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));}
  .skill-card .gl{font-size:11px;color:var(--gray);}
  .skill-card .stt{font-size:11px;color:var(--text);margin-top:4px;}

  .add-btn{margin-top:10px;width:100%;padding:11px;background:var(--glass-bg);border:1.5px dashed var(--accent);border-radius:14px;color:var(--text);font-size:13px;cursor:pointer;}
  .add-btn:active{background:var(--glass-solid);}
  .mini-note{font-size:11px;color:var(--gray);margin-top:8px;}

  .modal-mask{position:fixed;inset:0;background:rgba(44,44,44,.45);z-index:80;display:none;align-items:flex-end;justify-content:center;}
  .modal-mask.show{display:flex;}
  .modal{background:var(--glass-bg);-webkit-backdrop-filter:blur(calc(var(--blur) + 10px)) saturate(1.3);backdrop-filter:blur(calc(var(--blur) + 10px)) saturate(1.3);border:1px solid var(--glass-border);border-radius:24px 24px 0 0;width:100%;max-width:480px;padding:18px 16px 24px;max-height:88vh;overflow:auto;box-shadow:var(--shadow);}
  .modal h3{margin:0 0 14px;font-size:17px;color:var(--ink);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--text);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--glass-border);border-radius:12px;font-size:14px;font-family:inherit;background:var(--glass-flat);color:var(--text);outline:none;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
  .field input[type=number]{width:100%;}
  .field textarea{resize:vertical;min-height:60px;}
  .field .imgpick{height:90px;border-radius:12px;background:var(--glass-flat);display:flex;align-items:center;justify-content:center;color:var(--gray);font-size:12px;cursor:pointer;background-size:cover;background-position:center;border:1px dashed var(--accent);}
  .modal-ops{display:flex;gap:10px;margin-top:8px;}
  .modal-ops button{flex:1;padding:13px;border-radius:14px;font-size:14px;cursor:pointer;border:none;}
  .modal-ops .save{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;font-weight:600;}
  .modal-ops .cancel{background:var(--glass-solid);color:var(--text);border:1px solid var(--glass-border);}

  .pill{display:inline-block;background:var(--glass-solid);border:1px solid var(--glass-border);border-radius:12px;padding:2px 8px;font-size:11px;color:var(--text);margin:2px;}
  .mind-top{background:var(--glass-solid);-webkit-backdrop-filter:blur(var(--blur));backdrop-filter:blur(var(--blur));border:1px solid var(--glass-border);border-left:4px solid var(--accent);border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;box-shadow:var(--shadow);}
  .mind-top .mt{font-size:11px;color:var(--gray);font-family:var(--font-en);}
  .mind-top .mm{font-size:14px;font-weight:600;margin-top:2px;color:var(--ink);}
  .feed-input{display:flex;gap:8px;margin-bottom:12px;}
  .feed-input input{flex:1;padding:11px;border:1px solid var(--glass-border);border-radius:12px;font-size:13px;background:var(--glass-flat);color:var(--text);}
  .feed-input button{background:linear-gradient(135deg,var(--primary),var(--accent));border:none;color:#fff;border-radius:12px;padding:0 16px;font-size:13px;cursor:pointer;}
  .feed-cat{font-size:11px;color:var(--accent);font-weight:600;font-style:normal;}
  .feed-item{padding:9px 4px;border-bottom:1px solid var(--line);font-size:13px;color:var(--text);}
  .feed-item .src{font-size:10px;color:var(--gray);margin-top:2px;}
  .toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:rgba(44,44,44,.9);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80%;text-align:center;}
  .toast.show{opacity:1;}
  .back-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .back-row button{background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink);}

  .theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
  .theme-opt{background:var(--glass-solid);border:1.5px solid var(--glass-border);border-radius:14px;padding:12px;text-align:center;cursor:pointer;font-size:13px;color:var(--text);}
  .theme-opt.active{border-color:var(--accent);font-weight:700;}
  .theme-opt .sw{height:30px;border-radius:8px;margin-bottom:8px;}
  .theme-opt.cold .sw{background:linear-gradient(135deg,#F2EFEC,#D4C5B0);}
  .theme-opt.warm .sw{background:linear-gradient(135deg,#FBF6F0,#E8C4C4);}
  .theme-opt.minimal .sw{background:linear-gradient(135deg,#FFFFFF,#CCCCCC);}
  .theme-opt.dark .sw{background:linear-gradient(135deg,#1F1F1F,#D4C5B0);}
  .slider-row{margin:12px 0;}
  .slider-row label{font-size:12px;color:var(--text);display:flex;justify-content:space-between;}
  .slider-row input{width:100%;accent-color:var(--accent);margin-top:6px;}

  /* 视频学习区 */
  .video-list{margin-top:8px;}
  .video-item{background:var(--glass-solid);border:1px solid var(--glass-border);border-radius:12px;padding:8px;margin-bottom:8px;}
  .video-item .vhead{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);}
  .video-item .vhead .vtitle{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .video-item .vhead button{background:none;border:none;color:var(--gray);font-size:14px;cursor:pointer;}
  .video-item iframe{width:100%;height:190px;border:none;border-radius:8px;margin-top:6px;background:#000;}
  .video-input{display:flex;gap:8px;margin-top:8px;}
  .video-input input{flex:1;padding:10px;border:1px solid var(--glass-border);border-radius:12px;font-size:13px;background:var(--glass-flat);color:var(--text);}

function $(s){return document.querySelector(s);}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1800);}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function daysBetween(a,b){const d1=new Date(a+"T00:00:00");const d2=new Date(b+"T00:00:00");return Math.round((d2-d1)/86400000);}

function pickImage(path,cb,opts){
  opts=opts||{};
  const inp=document.createElement("input");inp.type="file";inp.accept="image/*";
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;
    compressImage(f,(data,err)=>{
      if(err){toast(err);return;}
      setPath(path,data);save();cb&&cb();
    },opts);
  };
  inp.click();
}
function setPath(path,val){
  const parts=path.split(".");let o=state;
  for(let i=0;i<parts.length-1;i++)o=o[parts[i]];
  o[parts[parts.length-1]]=val;
}
function getPath(path){const parts=path.split(".");let o=state;for(const p of parts){if(o==null)return null;o=o[p];}return o;}
function compressImage(file,cb,opts){
  opts=opts||{};
  const name=(file.name||"").toLowerCase();
  const type=(file.type||"").toLowerCase();
  const maxBytes=opts.maxBytes||(5*1024*1024);
  const okExt=/\.(jpe?g|png|gif|webp|bmp)$/.test(name);
  const okType=/^image\/(jpeg|png|gif|webp|bmp)/.test(type);
  if(!okExt && !okType){
    if(/\.heic|\.heif/.test(name)||type==="image/heic"||type==="image/heif")
      return cb(null,"⚠️ 图片格式不支持：iPhone 实况/HEIC 格式浏览器无法识别。请在相册中把该照片「导出为 JPG」或改用 JPEG/PNG 后重试。");
    return cb(null,"⚠️ 图片格式不支持（仅支持 JPG / PNG / GIF / WEBP）。");
  }
  if(file.size>maxBytes)
    return cb(null,"⚠️ 图片超过大小限制（建议 ≤5MB）。请压缩后重试。");
  const r=new FileReader();
  r.onerror=()=>cb(null,"⚠️ 读取图片失败，请重试。");
  r.onload=()=>{const img=new Image();
    img.onerror=()=>cb(null,"⚠️ 图片解码失败，可能是损坏或特殊格式。请换一张 JPG/PNG。");
    img.onload=()=>{try{
      let max=opts.fullRes?2000:1200;
      let w=img.width,h=img.height;if(!w||!h)return cb(null,"⚠️ 图片尺寸异常，解码失败。");
      if(w>max||h>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s);}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      let q=0.62,out=c.toDataURL("image/jpeg",q);
      while(out.length>1200000 && q>0.35){q=Math.max(0.35,q-0.08);out=c.toDataURL("image/jpeg",q);}
      cb(out,null);
    }catch(e){cb(null,"⚠️ 处理图片出错："+(e&&e.message?e.message:e)+"。请换一张 JPG/PNG。");}};
    img.src=r.result;
  };
  r.readAsDataURL(file);
}

}

    '<div class="mini-note">• 覆盖/拉伸：在预览框内「拖动」图片调整显示位置。<br>• 适应：完整显示，自动上下/左右留白。<br>• 🤖 智能建议：自动居中并采用覆盖（浏览器端无法真正识别人脸，此处以智能居中替代）。</div>'+
    '<div class="modal-ops"><button class="cancel" onclick="covSmart()">🤖 智能建议</button><button class="cancel" onclick="closeCover()">取消</button><button class="save" onclick="covConfirm(\''+key+'\')">确认保存</button></div>';

  prev.addEventListener("touchend",()=>dragging=false);

}

function validateCSS(css){
  let open=0,line=1;
  for(let i=0;i<css.length;i++){
    const c=css[i];
    if(c==="\n")line++;
    else if(c==="{")open++;
    else if(c==="}"){open--;if(open<0)return "第 "+line+" 行：右花括号 } 多了或未配对，请检查是否少了对应的 {";}
  }
  if(open>0)return "括号未闭合：还差 "+open+" 个 }，请检查最后一段 CSS 是否少写了 }";
  if(/\/\*([^*]|\*(?!\/))*$/.test(css))return "注释未闭合：发现有 /* 但没有对应的 */";
  return null;
}

function computeStats(){
  const today=todayStr();let done=0,total=0,records=0;
  for(const id in MODULE_DEFS){
    MODULE_DEFS[id].panels.forEach(p=>{
      if(p.type==="checklist"){const arr=state.modules[id].panels[p.key]||[];arr.forEach(it=>{total++;records++;if(it.doneDate===today){done++;}});}
      else if(p.type==="table"||p.type==="cards"||p.type==="countdown"){const arr=state.modules[id].panels[p.key]||[];records+=arr.length;}
    });
  }
  let streak=0;const set=new Set(state.meta.checkinDays);let d=new Date();
  while(set.has(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"))){streak++;d.setDate(d.getDate()-1);}
  return {streak,done,total,records,usageDays:state.meta.usageDays.length};
}

  const feeds=(state.feeds[colId]||[]).slice();
  let h='<div class="card"><h3>📥 投喂记录区 <span class="tag">链接/图片/文件/文字</span></h3>';
  if(feeds[0]){const d=daysSince(feeds[0].time.slice(0,10));if(d>=3)h+='<div class="quote-bar" style="border-color:var(--accent)">🌸 该栏目已 '+d+' 天没新投喂，该喂点新内容了～</div>';}
  const counts={};feeds.forEach(f=>counts[f.type]=(counts[f.type]||0)+1);
  Object.keys(counts).forEach(t=>{if(counts[t]>=5)h+='<div class="mini-note">「'+typeLabel(t)+'」已投喂 '+counts[t]+' 条，是否整理成一份合集/心得？📒</div>';});
  h+='<div class="feed-input"><input id="feedIn_'+colId+'" placeholder="粘贴链接或文字，或点下方上传" /><button onclick="feedFromInput(\''+colId+'\')">投喂</button></div>';
  h+='<div style="display:flex;gap:8px;margin-bottom:10px"><button class="add-btn" style="margin:0;flex:1" onclick="feedUpload(\''+colId+'\',\'image\')">📷 上传图片</button><button class="add-btn" style="margin:0;flex:1" onclick="feedUpload(\''+colId+'\',\'file\')">📎 上传文件</button></div>';
  h+='<table><thead><tr><th>时间</th><th>类型</th><th>来源/标题</th><th>摘要/描述</th></tr></thead><tbody>';
  if(!feeds.length)h+='<tr><td colspan="4" style="color:#bbb;text-align:center;padding:10px">暂无投喂记录，来喂第一条吧 🌸</td></tr>';
  feeds.forEach(f=>{
    let src=f.source||"—";
    if(f.type==="link"&&/^https?:\/\//.test(f.source))src='<a href="'+esc(f.source)+'" target="_blank" style="color:var(--accent)">🔗 '+esc(f.source.length>42?f.source.slice(0,42)+"…":f.source)+'</a>';
    else if(f.dataUrl)src='<a href="'+f.dataUrl+'" target="_blank" style="color:var(--accent)">'+esc(f.source||"附件")+'</a>';
    else src=esc(src);
    h+='<tr><td style="white-space:nowrap">'+esc(f.time)+'</td><td>'+typeLabel(f.type)+'</td><td>'+src+'</td><td>'+esc(f.summary||"")+' <span style="cursor:pointer;color:#bbb" onclick="delFeedRec(\''+colId+'\',\''+f.id+'\')">🗑</span></td></tr>';
  });
  h+='</tbody></table></div>';
  return h;
}
/* 含结构化数据时，尝试自动填入对应表格（启发式，失败静默） */
function tryAutoFill(colId,type,source,summary){
  try{
    const text=(source||"")+" "+(summary||"");
    if(colId==="alert"){
      const dm=text.match(/((?:六级|国考|期末|考研|省考|教资))[^\d]*?(\d{4})[-./](\d{1,2})(?:[-./](\d{1,2}))?/);
      if(dm){const name=dm[1];let date=dm[2]+"-"+dm[3].padStart(2,"0")+(dm[4]?"-"+dm[4].padStart(2,"0"):"-01");
        const arr=state.modules.alert.panels.exams;if(!arr.some(x=>x.name===name&&x.date===date)){arr.push({id:uid(),name,date,status:"未报名"});save();toast("🔔 已自动创建考试节点："+name);}}
    }
    if(colId==="posture"){
      const wm=text.match(/体重[^\d]*?(\d+(?:\.\d+)?)\s*斤?/);
      if(wm){const arr=state.modules.posture.panels.monthly;if(!arr.some(x=>x.weight===wm[1]+"斤")){arr.push({id:uid(),date:"投喂",weight:wm[1]+"斤",waist:"",thigh:"",score:""});save();toast("📏 已自动填入体重记录");}}
    }
    if(colId==="money"){
      const am=text.match(/(?:¥|￥|花费|金额)?\s*(\d+(?:\.\d+)?)\s*(?:元|块)?/);
      const catm=text.match(/(餐饮|护肤|穿搭|学习|社交|其他)/);
      if(am){const arr=state.modules.money.panels.records;arr.push({id:uid(),date:todayStr(),item:(source||summary||"投喂").slice(0,12),amount:parseFloat(am[1]),cat:catm?catm[1]:"其他",need:"否"});save();toast("💰 已自动记入一笔账单");}}
    if(colId==="annual"){
      const wm=text.match(/体重[^\d]*?(\d+(?:\.\d+)?)\s*斤?/);
      if(wm){const arr=state.modules.annual.panels.compare;const r=arr.find(x=>x.dim==="体重");if(r&&!r.start){r.start=wm[1]+"斤";save();}}
    }
  }catch(e){}
}

/* ============ B站视频学习区 ============ */
function biliEmbed(url){
  // 提取 BV 号或 av 号
  let m=url.match(/BV[0-9A-Za-z]{10}/);
  if(m)return "https://player.bilibili.com/player.html?bvid="+m[0]+"&page=1&high_quality=1&danmaku=0";
  m=url.match(/av(\d+)/i);
  if(m)return "https://player.bilibili.com/player.html?aid="+m[1]+"&page=1&high_quality=1&danmaku=0";
  // 纯 BV 号
  if(/^BV[0-9A-Za-z]{10}$/.test(url))return "https://player.bilibili.com/player.html?bvid="+url+"&page=1&high_quality=1&danmaku=0";
  return null;
}
function addVideo(colId){
  const el=$("#videoIn_"+colId);if(!el)return;const v=el.value.trim();if(!v)return;
  const embed=biliEmbed(v);
  if(!embed){toast("⚠️ 无法识别B站链接，请粘贴 BV 号或完整链接");return;}
  state.videos[colId]=state.videos[colId]||[];
  state.videos[colId].unshift({id:uid(),title:v,embed});
  save();el.value="";renderModule(colId);toast("✅ 视频已添加到【"+colTitle(colId)+"】");
}
function delVideo(colId,fid){if(!confirm("删除该视频？"))return;state.videos[colId]=(state.videos[colId]||[]).filter(x=>x.id!==fid);save();renderModule(colId);}
function renderVideoArea(colId){
  const list=state.videos[colId]||[];
  let h='<div class="card"><h3>🎬 B站视频学习 <span class="tag">'+list.length+' 个</span></h3>';
  h+='<div class="mini-note">粘贴 B站链接或 BV号，即可在本栏目内直接观看学习。</div>';
  h+='<div class="video-input"><input id="videoIn_'+colId+'" placeholder="粘贴B站链接 / BV号" /><button onclick="addVideo(\''+colId+'\')">添加</button></div>';
  if(list.length){
    h+='<div class="video-list">';
    list.forEach(v=>{
      h+='<div class="video-item"><div class="vhead"><span class="vtitle">▶ '+esc(v.title)+'</span><button onclick="delVideo(\''+colId+'\',\''+v.id+'\')">🗑</button></div>'+
         '<iframe src="'+v.embed+'" scrolling="no" frameborder="no" allowfullscreen="true"></iframe></div>';
    });
    h+='</div>';
  }else{
    h+='<div class="mini-note">暂无视频，粘贴一个 B站链接试试 🌸</div>';
  }
  h+='</div>';
  return h;
}

/* ============ 视频专栏 + 视频开关 ============ */
function showVideoHub(){
  currentView="videos";$("#view-home").classList.remove("active");$("#view-module").classList.add("active");
  $("#topTitle").innerHTML="🎬 视频专栏";
  const v=$("#view-module");
  let html='<div class="back-row"><button onclick="showHome()">‹</button><div style="font-weight:600">🎬 视频专栏</div></div>';
  html+='<div class="quote-bar">所有栏目的 B站视频汇总，一处看全部。</div>';
  let total=0;
  for(const id in MODULE_DEFS){
    const list=state.videos[id]||[];
    if(!list.length)continue;
    total+=list.length;
    html+='<div class="card"><h3>'+MODULE_DEFS[id].icon+' '+esc(MODULE_DEFS[id].title)+' <span class="tag">'+list.length+' 个</span></h3>';
    list.forEach(vv=>{html+='<div class="video-item"><div class="vhead"><span class="vtitle">▶ '+esc(vv.title)+'</span></div><iframe src="'+vv.embed+'" scrolling="no" frameborder="no" allowfullscreen="true"></iframe></div>';});
    html+='</div>';
  }
  if(!total)html+='<div class="card"><h3>暂无视频</h3><div class="mini-note">在各栏目底部「🎬 B站视频学习」区添加视频后，会自动汇总到这里。</div></div>';
  v.innerHTML=html;
  renderDrawer();
}
function toggleVideo(id){
  state.meta.videoOn=state.meta.videoOn||{};
  if(state.meta.videoOn[id]===false){delete state.meta.videoOn[id];}
  else{state.meta.videoOn[id]=false;}
  save();renderDecor();toast("✅ 视频区开关已更新");
}

/* ============ 启动 ============ */
function tick(){const d=new Date();$("#clockT").textContent=d.toTimeString().slice(0,8);$("#clockD").textContent=d.toLocaleDateString("zh-CN",{month:"long",day:"numeric",weekday:"short"});}
function boot(){
  tick();setInterval(tick,1000);
  applyUserStyle();
  const t=todayStr();if(!state.meta.usageDays.includes(t)){state.meta.usageDays.push(t);save();}
  renderBoot();
  renderHome();renderDrawer();
  $("#bootMask").style.display="flex";
}
boot();
</script>
